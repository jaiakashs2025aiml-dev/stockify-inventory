<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Products | Stockify</title>

```
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 30px;
        background: #f4f6fb;
        color: #263238;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 12px #00000010;
        overflow-x: auto;
    }

    h1 {
        color: #172554;
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 25px;
    }

    th, td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    th {
        background: #172554;
        color: white;
    }

    tr:hover {
        background: #f1f5f9;
    }

    .button {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 7px;
        margin: 4px;
        border: none;
        cursor: pointer;
    }

    .edit {
        background: #16a34a;
    }

    .delete {
        background: #dc2626;
    }

    .empty {
        text-align: center;
        padding: 25px;
        color: #64748b;
    }

    form {
        display: inline;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>📦 Stockify - Product List</h1>

<table>
    <thead>
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Category ID</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="product : ${products}">

            <td th:text="${product.productId}"></td>
            <td th:text="${product.productName}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.quantity}"></td>
            <td th:text="${product.categoryId}"></td>

            <td>
                <a th:href="@{/products/edit/{id}(id=${product.productId})}"
                   class="button edit">Edit</a>

                <form th:action="@{/products/delete/{id}(id=${product.productId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this product?');">

                    <button type="submit" class="button delete">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="6" class="empty">
                No products found. Please add a product.
            </td>
        </tr>

    </tbody>
</table>

<a href="/" class="button">← Back to Dashboard</a>

<a href="/products/add" class="button">+ Add Product</a>
```

</div>

</body>
</html>
