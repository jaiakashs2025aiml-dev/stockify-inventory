<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Stock | Stockify</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6fb;
        color: #263238;
        padding: 40px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 12px #00000010;
    }

    h1 {
        text-align: center;
        color: #172554;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
    }

    th {
        background: #172554;
        color: white;
        padding: 15px;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #ddd;
    }

    input {
        width: 90px;
        padding: 9px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .back {
        display: inline-block;
        margin-top: 25px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 6px;
    }

    .empty {
        padding: 25px;
        color: #64748b;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>📦 Stock Management</h1>

<table>
    <thead>
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Current Stock</th>
            <th>New Quantity</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="product : ${products}">

            <td th:text="${product.productId}"></td>

            <td th:text="${product.productName}"></td>

            <td th:text="${product.quantity}"></td>

            <td>
                <form th:action="@{/stock/update}" method="post">

                    <input type="hidden"
                           name="productId"
                           th:value="${product.productId}">

                    <input type="number"
                           name="quantity"
                           min="0"
                           th:value="${product.quantity}"
                           required>

            </td>

            <td>
                    <button type="submit">Update Stock</button>

                </form>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="5" class="empty">
                No products available.
            </td>
        </tr>

    </tbody>
</table>

<a href="/" class="back">← Back to Dashboard</a>
```

</div>

</body>
</html>
